<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(0,212,255,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0080ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orb top-right -->
  <radialGradient id="glow1" cx="75%" cy="20%" r="40%">
    <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.08" />
    <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Glow orb bottom-left -->
  <radialGradient id="glow2" cx="25%" cy="80%" r="35%">
    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.07" />
    <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- RB monogram -->
  <rect x="80" y="80" width="56" height="56" rx="12" fill="url(#grad)"/>
  <text x="108" y="118" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0a0a0f" text-anchor="middle">RB</text>

  <!-- Name -->
  <text x="80" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="900" fill="white">Robby Benipal</text>

  <!-- Gradient underline -->
  <rect x="80" y="305" width="500" height="4" rx="2" fill="url(#grad)"/>

  <!-- Title -->
  <text x="80" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#9ca3af">Software Engineer · Full Stack Developer</text>

  <!-- Location -->
  <text x="80" y="415" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#6b7280">📍 Dallas / Denton, Texas</text>

  <!-- Tech pills -->
  <g transform="translate(80, 460)">
    <!-- C# pill -->
    <rect width="60" height="30" rx="6" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
    <text x="30" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#00d4ff" text-anchor="middle">C#</text>
    <!-- .NET pill -->
    <rect x="72" width="65" height="30" rx="6" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
    <text x="104" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#00d4ff" text-anchor="middle">.NET</text>
    <!-- React pill -->
    <rect x="149" width="65" height="30" rx="6" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="181" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">React</text>
    <!-- Azure pill -->
    <rect x="226" width="65" height="30" rx="6" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="258" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">Azure</text>
    <!-- Blazor pill -->
    <rect x="303" width="65" height="30" rx="6" fill="rgba(0,128,255,0.1)" stroke="rgba(0,128,255,0.3)" stroke-width="1"/>
    <text x="335" y="20" font-family="monospace" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">Blazor</text>
  </g>

  <!-- URL -->
  <text x="80" y="580" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#374151">robbybenipal.github.io/Portfolio-RobbyBenipal</text>
</svg>
